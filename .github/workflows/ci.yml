name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt ruff==0.17.0 pytest-cov==7.1.0

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes com cobertura
        run: pytest --cov=app --cov-fail-under=70